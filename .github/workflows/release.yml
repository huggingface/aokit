name: Release

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Validate release tag
        run: |
          VERSION=$(uv version --short)
          if [[ "${GITHUB_REF_NAME}" != "$VERSION" && \
                "${GITHUB_REF_NAME}" != "v$VERSION" ]]; then
            echo "Release tag '${GITHUB_REF_NAME}' does not match version '$VERSION'"
            exit 1
          fi

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: uvx twine check --strict dist/*

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
